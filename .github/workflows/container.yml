name: Container Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify channel detection and endpoint preferences
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint channel changes
        working-directory: web
        run: bunx oxlint --format stylish -c .oxlintrc.json src/features/channels/api.ts src/features/channels/lib/channel-form.ts src/features/channels/components/channel-detection-settings.tsx src/features/channels/components/dialogs/channel-fingerprint-button.tsx src/features/channels/components/dialogs/channel-test-dialog.tsx src/features/channels/components/drawers/channel-mutate-drawer.tsx src/features/channels/components/__tests__/channel-detection-settings.test.tsx src/features/channels/components/__tests__/channel-fingerprint-button.test.tsx src/features/channels/lib/__tests__/channel-detection-settings.test.ts
      - name: Type check
        if: ${{ !cancelled() }}
        working-directory: web
        run: bun run typecheck
      - name: Channel frontend regression tests
        if: ${{ !cancelled() }}
        working-directory: web
        run: bun test src/features/channels/lib/__tests__/channel-detection-settings.test.ts src/features/channels/components/__tests__/channel-detection-settings.test.tsx src/features/channels/components/__tests__/channel-fingerprint-button.test.tsx
      - name: Go regression tests
        if: ${{ !cancelled() }}
        run: go test ./pkg/modelfingerprint ./controller ./model ./service ./router -run 'Test(RankMatchesFrozen|RefusalDoesNot|NumbersSelect|Fingerprint|ChannelTestUsesSaved|ChannelEndpointPreference)' -count=1
  build:
    needs: verify
    name: Build multi-platform image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/imlr/new-api
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=sha-,format=long
      cache: true
      cache-scope: new-api
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: IMLR
          password: ${{ secrets.GITHUB_TOKEN }}

  deploy-hk:
    name: Deploy HK
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-hk
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure restricted SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HK_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HK_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Pull image and deploy
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf '%s\n%s\n%s\n' "$DEPLOY_ACTOR" "$GHCR_TOKEN" "$DEPLOY_SHA" | ssh \
            -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${{ vars.HK_PORT }}" \
            "${{ vars.HK_USER }}@${{ vars.HK_HOST }}"

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/deploy"
